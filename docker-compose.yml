services:
  kontact:
    build: .
    ports:
      - "${PORT:-8000}:${PORT:-8000}"
    volumes:
      - kontact-data:/app/data
    env_file:
      - .env
    # DEFAULT = embedded ChromaDB + single worker (no behavior/data change).
    # To scale: set CHROMA_HOST=chroma + UVICORN_WORKERS=4 in .env, then run
    #   docker compose --profile scale up -d --build
    # (CHROMA_HOST is read from .env by vectorstore.py; empty/unset = embedded.)
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${PORT:-8000}/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Shared vector DB — OPT-IN. Only starts with `--profile scale`. ALL kontact
  # workers talk to it over HTTP so kontact can run multiple workers safely.
  # Not published to the host; reachable on the compose network as chroma:8000.
  chroma:
    image: chromadb/chroma:1.4.1
    profiles: ["scale"]
    restart: unless-stopped
    volumes:
      - chroma-data:/data
    environment:
      - IS_PERSISTENT=TRUE
      - ANONYMIZED_TELEMETRY=FALSE

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    profiles: ["https"]
    ports:
      - "${CADDY_HTTP_PORT:-80}:80"
      - "${CADDY_HTTPS_PORT:-443}:443"
      - "${CADDY_HTTPS_PORT:-443}:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      - DOMAIN=${DOMAIN:-kontact.example.com}
    depends_on:
      - kontact

volumes:
  kontact-data:
  chroma-data:
  caddy_data:
  caddy_config:
